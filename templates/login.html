<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>MyTracker - Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-theme="dark">
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><i data-lucide="target"></i></div>
                <h1>MyTracker</h1>
            </div>
            <p class="auth-subtitle">Welcome back! Log in to continue tracking.</p>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password" required autocomplete="current-password">
                </div>
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" class="btn-primary auth-btn" id="submit-btn">Log In</button>
            </form>
            <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
    <script>
    lucide.createIcons();
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const err = document.getElementById('auth-error');
        err.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                err.textContent = data.error || 'Login failed';
            }
        } catch (e) {
            err.textContent = 'Connection error';
        }
        btn.disabled = false;
        btn.textContent = 'Log In';
    }
    </script>
</body>
</html>
