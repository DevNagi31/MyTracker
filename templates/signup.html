<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>MyTracker - Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-theme="dark">
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><i data-lucide="target"></i></div>
                <h1>MyTracker</h1>
            </div>
            <p class="auth-subtitle">Create your account and start tracking your goals.</p>
            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat your password" required autocomplete="new-password">
                </div>
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" class="btn-primary auth-btn" id="submit-btn">Create Account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
        </div>
    </div>
    <script>
    lucide.createIcons();
    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const err = document.getElementById('auth-error');
        err.textContent = '';

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (password !== confirm) {
            err.textContent = 'Passwords do not match';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        try {
            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: password,
                }),
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                err.textContent = data.error || 'Signup failed';
            }
        } catch (e) {
            err.textContent = 'Connection error';
        }
        btn.disabled = false;
        btn.textContent = 'Create Account';
    }
    </script>
</body>
</html>
